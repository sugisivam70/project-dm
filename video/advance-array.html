<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    let arr = [100,679,342,879,435,118]

    let result=arr.filter(function(x){
      return x<=500;
    })
    let gst = result.map(function(y){
      return Math.round(y+y*0.18);
    })

    let checkout = gst.reduce(function(acc,val){
      return acc+ val;
    },0)
    console.log(checkout)
  </script>
</body>
</html>
