<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bolder;
      }
      .nav {
        background-color: #d9d9d9;
        height: 90px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .nav img {
        height: 60px;
        width: auto;
      }
      .container {
        height: 600px;
        background-color: rgb(254, 254, 254);
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        padding-bottom:10px ;
      }
      .box {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background-color:rgb(190, 190, 190) ;
        padding: 20px;
        border-radius: 15px;
        width: 400px;
        height: 400px;
        padding-bottom: 0;
        border: 1px solid black;


      }
      .box img {
        height: 150px;
      }
      .box input{
        background: #f8f8f8;
        padding: 3px;
        padding-left: 1px;
        border-radius: 5px;
        border: none;
        width: 200px;
      }
      .box button{
        background: #000;
        color: #D7DF23;
        padding: 3px;
        border-radius: 5px;
        border: none;
        width: 200px;

      }

    </style>
  </head>
  <body>
    <div class="nav">
      <img
        src="https://download.logo.wine/logo/Ola_Cabs/Ola_Cabs-Logo.wine.png"alt=""
      />
    </div>
    <div class="container">
      <div class="box">
        <div>
          <img
            src="https://static.vecteezy.com/system/resources/thumbnails/044/242/798/small/a-sleek-yellow-sports-bike-stands-ready-for-action-png.png"
            alt=""
          />
        </div>
        <input type="text" placeholder="enter Km" />
        <button>submit</button>
      </div>
      <div class="box">
        <div>
         <img src="https://png.pngtree.com/png-vector/20240905/ourmid/pngtree-black-electric-car-illustration-clipart-png-image_13757062.png" alt="">
        </div>
        <input type="text" placeholder="enter Km" />
        <button>submit</button>
      </div>
      <div class="box">
        <div>
          <img src="https://png.pngtree.com/png-vector/20251017/ourmid/pngtree-yellow-auto-rickshaw-isolated-on-transparent-background-png-image_17761844.webp" alt="">
        </div>
        <input type="text" placeholder="enter Km" />
        <button>submit</button>
      </div>
    </div>

    <style>
      
    </style>
  </body>
</html>
